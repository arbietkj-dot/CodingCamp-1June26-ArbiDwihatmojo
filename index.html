<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Life Dashboard Arbi Dwihatmojo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top bar (no toggle here anymore) -->
  <header class="top-bar">
    <span class="top-bar-title">Todo Life Dashboard</span>
  </header>

  <main class="dashboard">

    <!-- Greeting Widget -->
    <section id="greeting-widget" aria-label="Greeting Widget">
      <p id="greeting-text">Good Morning</p>
      <p id="time-display">00:00</p>
      <p id="date-display">Monday, 1 January 2025</p>
      <form id="name-form" class="name-form">
        <input
          type="text"
          id="name-input"
          placeholder="Enter your name…"
          maxlength="50"
          aria-label="Your name"
          autocomplete="name"
        />
        <button type="submit" id="name-save">Save</button>
      </form>
      <p id="name-error" class="error-message" aria-live="polite"></p>
    </section>

    <!-- Focus Timer -->
    <section id="focus-timer" aria-label="Focus Timer">
      <h2 id="timer-mode-label">🍅 Pomodoro</h2>
      <p id="timer-display">25:00</p>

      <!-- Pomodoro preset buttons -->
      <div class="timer-presets" role="group" aria-label="Timer presets">
        <button class="preset-btn active" data-minutes="25">🍅 Pomodoro</button>
        <button class="preset-btn" data-minutes="5">☕ Short Break</button>
        <button class="preset-btn" data-minutes="15">🌿 Long Break</button>
      </div>

      <!-- Custom duration input -->
      <div class="timer-duration">
        <label for="timer-minutes">Custom (min):</label>
        <input
          type="number"
          id="timer-minutes"
          min="1"
          max="180"
          value="25"
          aria-label="Timer duration in minutes"
        />
        <button id="timer-set">Set</button>
      </div>
      <span id="timer-set-error" class="error-message" aria-live="polite"></span>

      <div class="timer-controls">
        <button id="timer-start">Start</button>
        <button id="timer-stop">Stop</button>
        <button id="timer-reset">Reset</button>
      </div>
    </section>

    <!-- Todo List -->
    <section id="todo-list" aria-label="Todo List">
      <div class="todo-header">
        <h2>Tasks</h2>
        <div class="todo-sort" role="group" aria-label="Sort tasks">
          <label for="todo-sort-select">Sort:</label>
          <select id="todo-sort-select" aria-label="Sort tasks by">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="active">Active first</option>
            <option value="completed">Completed first</option>
            <option value="alpha-asc">A → Z</option>
            <option value="alpha-desc">Z → A</option>
          </select>
        </div>
      </div>
      <form id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a new task…"
          maxlength="500"
          aria-label="New task text"
        />
        <button type="submit" id="todo-add">Add</button>
      </form>
      <div id="todo-error" class="error-message" aria-live="polite"></div>
      <ul id="todo-list-items" aria-label="Task list"></ul>
    </section>

    <!-- Quick Links -->
    <section id="quick-links" aria-label="Quick Links">
      <h2>Quick Links</h2>
      <form id="links-form">
        <input
          type="text"
          id="link-label-input"
          placeholder="Label"
          maxlength="100"
          aria-label="Link label"
        />
        <div id="link-label-error" class="error-message" aria-live="polite"></div>
        <input
          type="url"
          id="link-url-input"
          placeholder="https://example.com"
          aria-label="Link URL"
        />
        <div id="link-url-error" class="error-message" aria-live="polite"></div>
        <button type="submit" id="link-add">Add Link</button>
      </form>
      <div id="links-container" aria-label="Saved links"></div>
    </section>

  </main>

  <!-- Fixed bottom bar with dark/light toggle -->
  <footer class="bottom-bar">
    <label class="theme-switch" aria-label="Toggle dark mode">
      <input type="checkbox" id="theme-toggle" role="switch" aria-checked="false" />
      <span class="switch-track">
        <span class="switch-icon switch-icon--light">☀️</span>
        <span class="switch-icon switch-icon--dark">🌙</span>
        <span class="switch-thumb"></span>
      </span>
      <span class="switch-label" id="theme-label">Light Mode</span>
    </label>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
